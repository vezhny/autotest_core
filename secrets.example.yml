# Template of the local secrets file. Copy it to ~/.autotest_core/secrets.yml (outside the repository) and fill in.
# Another location can be set with SECRETS_FILE environment variable.
# It is imported by src/main/resources/application.yml, so properties here are the same as in application-*.yml.
#
# On CI the same values come from environment variables, named after the property (Spring relaxed binding):
#   api.password -> API_PASSWORD, selenide.password -> SELENIDE_PASSWORD
#
# A missing secret fails only the test that uses it (see RequiredSecret), so fill in only what you need.

# Common secrets, used on every stand
api:
  password: <api password>

# Stand specific secrets override common ones
---
spring:
  config:
    activate:
      on-profile: stand1
api:
  password: <stand1 api password>

---
spring:
  config:
    activate:
      on-profile: stand2
api:
  password: <stand2 api password>
